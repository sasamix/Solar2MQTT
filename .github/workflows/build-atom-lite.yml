name: Build M5Stack ATOM Lite

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ATOM Lite
        run: pio run -e m5stack_atom_lite
      - name: Verify OTA artifact
        run: |
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.8.bin.ota"
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.8.bin"
          ls -lh .firmware/
      - name: Upload firmware to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.8.bin.ota" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.8.bin" \
            --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Solar2MQTT-m5stack-atom-lite
          path: |
            .firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.8.bin.ota
            .firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.8.bin
          if-no-files-found: error
