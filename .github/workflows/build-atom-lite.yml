name: Build M5Stack ATOM Lite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# Prevent parallel pushes from racing while replacing release assets.
concurrency:
  group: atom-lite-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ATOM Lite
        run: pio run -e m5stack_atom_lite
      - name: Validate ATOM Lite partition layout
        run: python tools/validate_atom_layout.py
      - name: Package USB migration
        run: python tools/package_atom_usb_migration.py
      - name: Verify OTA artifact
        run: |
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin.ota"
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin"
          test -s ".firmware/Solar2MQTT_m5stack_atom_lite_USB_MIGRATION_V0.0.0-dev-2.0.14Y.zip"
          ls -lh .firmware/
          unzip -l ".firmware/Solar2MQTT_m5stack_atom_lite_USB_MIGRATION_V0.0.0-dev-2.0.14Y.zip"
      - name: Upload firmware to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish 14Y migration'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.0.0-dev-2.0.14Y' }}"
          # Create the versioned release on first publication.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Solar2MQTT 0.0.0-dev-2.0.14Y USB migration" --target "${{ github.sha }}" --notes "ONE-TIME USB MIGRATION BUILD. Flash the USB migration ZIP without erase_flash to preserve NVS. Includes LittleFS MQTT backlog, Wi-Fi failover, faster live Modbus display updates and read-only PowMr diagnostics. Do not use normal OTA until the new partition layout is installed."
          # Delete by asset name first. This avoids gh --clobber using a stale asset ID.
          gh release delete-asset "$TAG" "Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin.ota" -y 2>/dev/null || true
          gh release delete-asset "$TAG" "Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin" -y 2>/dev/null || true
          gh release delete-asset "$TAG" "Solar2MQTT_m5stack_atom_lite_USB_MIGRATION_V0.0.0-dev-2.0.14Y.zip" -y 2>/dev/null || true
          gh release upload "$TAG" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin.ota" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin" \
            ".firmware/Solar2MQTT_m5stack_atom_lite_USB_MIGRATION_V0.0.0-dev-2.0.14Y.zip"
      - name: Remove old diagnostic releases
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TAG in \
            v0.0.0-dev-2.0.8 \
            v0.0.0-dev-2.0.9 \
            v0.0.0-dev-2.0.10 \
            v0.0.0-dev-2.0.11 \
            v0.0.0-dev-2.0.12 \
            v0.0.0-dev-2.0.13 \
            v0.0.0-dev-2.0.13A \
            v0.0.0-dev-2.0.14A \
            v0.0.0-dev-2.0.14B \
            v0.0.0-dev-2.0.14C \
            v0.0.0-dev-2.0.14D \
            v0.0.0-dev-2.0.14E \
            v0.0.0-dev-2.0.14F \
            v0.0.0-dev-2.0.14G \
            v0.0.0-dev-2.0.14H \
            v0.0.0-dev-2.0.14I \
            v0.0.0-dev-2.0.14J \
            v0.0.0-dev-2.0.14K \
            v0.0.0-dev-2.0.14L \
            v0.0.0-dev-2.0.14M \
            v0.0.0-dev-2.0.14N \
            v0.0.0-dev-2.0.14O \
            v0.0.0-dev-2.0.14Q \
            v0.0.0-dev-2.0.14P \
            v0.0.0-dev-2.0.14R \
            v0.0.0-dev-2.0.14S \
            v0.0.0-dev-2.0.14T \
            v0.0.0-dev-2.0.14U \
            v0.0.0-dev-2.0.14V
          do
            gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Solar2MQTT-m5stack-atom-lite
          path: |
            .firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin.ota
            .firmware/Solar2MQTT_m5stack_atom_lite_V0.0.0-dev-2.0.14Y.bin
            .firmware/Solar2MQTT_m5stack_atom_lite_USB_MIGRATION_V0.0.0-dev-2.0.14Y.zip
          if-no-files-found: error
